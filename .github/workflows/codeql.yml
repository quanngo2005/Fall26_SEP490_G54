name: "CodeQL Advanced"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '43 0 * * 1'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: autobuild
          - language: javascript-typescript
            build-mode: none

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Setup môi trường .NET
    - name: Setup .NET
      if: matrix.language == 'csharp'
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x' # Thay bằng phiên bản dự án đang dùng (ví dụ: 6.0.x, 7.0.x, 8.0.x)

    # Setup môi trường Node.js cho Angular
    - name: Setup Node.js
      if: matrix.language == 'javascript-typescript'
      uses: actions/setup-node@v4
      with:
        node-version: '20.x' # Thay bằng phiên bản Node tương thích Angular của bạn

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}

    # Nếu autobuild của C# gặp lỗi, chuyển 'build-mode: manual' ở matrix trên và mở bước này:
    # - name: Build C#
    #   if: matrix.language == 'csharp' && matrix.build-mode == 'manual'
    #   run: |
    #     dotnet restore
    #     dotnet build --no-incremental

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{ matrix.language }}"
