name: Backend CI

on:
  push:
    paths: ["backend/**", "scripts/codereview-backend.*", "scripts/check-coverage.ps1", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["backend/**", "scripts/codereview-backend.*", "scripts/check-coverage.ps1", ".github/workflows/backend-ci.yml"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Review backend
        shell: pwsh
        env:
          # Makes the database tests fail instead of skip when Postgres/Redis (Testcontainers) cannot start.
          CI: "true"
        run: ./scripts/codereview-backend.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-review-report
          path: |
            docs/codereview/reports/BACKEND_REPORT.md
            docs/codereview/reports/coverage.cobertura.xml
