@if (open()) {
  <aside class="right-drawer" role="dialog" aria-modal="false" [attr.aria-label]="titleText()">
    <header class="drawer-header">
      <div class="drawer-heading">
        <h2>{{titleText()}}</h2>
        @if (subtitleText()) {
          <p class="drawer-subtitle">{{subtitleText()}}</p>
        }
      </div>
      <ng-content select="[drawerHeaderActions]"></ng-content>
      <button type="button" class="drawer-close" [attr.aria-label]="text().close" (click)="close()">
        <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
          <path
            d="M3.72 3.72a.75.75 0 0 1 1.06 0L8 6.94l3.22-3.22a.75.75 0 1 1 1.06 1.06L9.06 8l3.22 3.22a.75.75 0 1 1-1.06 1.06L8 9.06l-3.22 3.22a.75.75 0 0 1-1.06-1.06L6.94 8 3.72 4.78a.75.75 0 0 1 0-1.06Z"
          />
        </svg>
      </button>
    </header>
    <div class="drawer-body">
      <ng-content></ng-content>
    </div>
    <footer class="drawer-footer">
      <ng-content select="[drawerFooter]"></ng-content>
    </footer>
  </aside>
}
