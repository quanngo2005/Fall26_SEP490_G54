<div class="kem-container" role="dialog" aria-modal="true" aria-labelledby="kcmTitle">
  <button
    type="button"
    class="kem-backdrop"
    (click)="close()"
    [attr.aria-label]="localization.common.close"
  ></button>

  <div class="kem-card">
    <header class="kem-header">
      <div>
        <h3 id="kcmTitle" class="kem-title">{{localization.kpi.createTitle}}</h3>
        <span class="kem-subtitle">{{localization.kpi.createSubtitle}}</span>
      </div>
      <button
        type="button"
        class="kem-close"
        (click)="close()"
        [attr.aria-label]="localization.common.close"
      >
        ✕
      </button>
    </header>

    <div class="kem-body">
      @if (error(); as err) {
        <div class="kem-error">⚠ {{err}}</div>
      }

      <section class="kem-section">
        <div class="kem-grid">
          <div class="kem-field">
            <label for="kcmCode">{{localization.kpi.code}} *</label>
            <input
              id="kcmCode"
              type="text"
              class="mono"
              [placeholder]="localization.kpi.codeExample"
              [ngModel]="code()"
              (ngModelChange)="code.set($event)"
            />
          </div>

          <div class="kem-field">
            <label for="kcmName">{{localization.kpi.name}} *</label>
            <input
              id="kcmName"
              type="text"
              [placeholder]="localization.kpi.nameExample"
              [ngModel]="name()"
              (ngModelChange)="name.set($event)"
            />
          </div>

          <div class="kem-field">
            <label for="kcmGroup">{{localization.kpi.group}}</label>
            <select id="kcmGroup" [ngModel]="groupId()" (ngModelChange)="groupId.set($event)">
              @for (g of groups(); track g.id) {
                <option [value]="g.id">{{g.name}}</option>
              }
            </select>
          </div>

          <div class="kem-field">
            <label for="kcmUnit">{{localization.kpi.unit}}</label>
            <select id="kcmUnit" [ngModel]="unit()" (ngModelChange)="unit.set($event)">
              @for (u of unitOptions; track u) {
                <option [value]="u">{{u}}</option>
              }
            </select>
          </div>

          <div class="kem-field">
            <label for="kcmDirection">{{localization.kpi.direction}}</label>
            <select
              id="kcmDirection"
              [ngModel]="direction()"
              (ngModelChange)="direction.set($event)"
            >
              <option value="HIGHER_BETTER">{{localization.kpi.higherBetter}}</option>
              <option value="LOWER_BETTER">{{localization.kpi.lowerBetter}}</option>
              <option value="ON_TARGET">{{localization.kpi.onTarget}}</option>
            </select>
          </div>

          <div class="kem-field">
            <label for="kcmAgg">{{localization.kpi.aggregation}}</label>
            <select id="kcmAgg" [ngModel]="aggregation()" (ngModelChange)="aggregation.set($event)">
              <option value="SUM">{{localization.kpi.sum}}</option>
              <option value="RATIO">{{localization.kpi.ratio}}</option>
              <option value="AVG">{{localization.kpi.average}}</option>
              <option value="NO_AGGREGATION">{{localization.kpi.noAggregation}}</option>
            </select>
          </div>

          <div class="kem-field full">
            <label for="kcmFormula">{{localization.kpi.formula}}</label>
            <input
              id="kcmFormula"
              type="text"
              class="mono"
              [placeholder]="localization.kpi.formulaExample"
              [ngModel]="formula()"
              (ngModelChange)="formula.set($event)"
            />
          </div>

          <div class="kem-field full">
            <label for="kcmDesc">{{localization.kpi.description}}</label>
            <textarea
              id="kcmDesc"
              rows="3"
              [placeholder]="localization.kpi.detailPlaceholder"
              [ngModel]="description()"
              (ngModelChange)="description.set($event)"
            ></textarea>
          </div>
        </div>
      </section>
    </div>

    <footer class="kem-footer">
      <span class="kem-audit"></span>
      <div>
        <button type="button" class="kem-btn-ghost" (click)="close()" [disabled]="saving()">
          {{localization.common.cancel}}
        </button>
        <button type="button" class="kem-btn-primary" (click)="submit()" [disabled]="saving()">
          {{saving() ? localization.kpi.creating : localization.kpi.create}}
        </button>
      </div>
    </footer>
  </div>
</div>
